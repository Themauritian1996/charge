<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Charge, carnet d'entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecf0; --surface:#f4f6f9; --surface-2:#e2e6eb; --text:#0b0c0e; --muted:#6c717a; --line:#d5dae0;
  --ink:#0b0c0e; --ink-contrast:#ffffff; --pos:#119a4c; --neg:#d8383d;
  --lift:7px 7px 18px rgba(160,169,183,.45), -7px -7px 18px rgba(255,255,255,.95);
  --press:inset 3px 3px 7px rgba(160,169,183,.45), inset -3px -3px 7px rgba(255,255,255,.95);
  --nav:rgba(236,239,243,.88); --scrim:rgba(20,22,26,.35);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#121214; --surface-2:#1c1c1f; --text:#f4f4f5; --muted:#8b8b93; --line:#242428;
    --ink:#f4f4f5; --ink-contrast:#000000; --pos:#30d158; --neg:#ff453a;
    --lift:0 0 0 1px #1d1d21; --press:inset 0 0 0 1px #2a2a2f;
    --nav:rgba(0,0,0,.84); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121214; --surface-2:#1c1c1f; --text:#f4f4f5; --muted:#8b8b93; --line:#242428;
  --ink:#f4f4f5; --ink-contrast:#000000; --pos:#30d158; --neg:#ff453a;
  --lift:0 0 0 1px #1d1d21; --press:inset 0 0 0 1px #2a2a2f;
  --nav:rgba(0,0,0,.84); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.ic{display:block;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:6px 18px calc(120px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{max-width:560px;margin:0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.brand{font-weight:500;font-size:15px;letter-spacing:.42em;margin-right:auto}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--pos)}
.sync.err::before{background:var(--neg)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon-btn:active{box-shadow:var(--press)}

/* Type */
.status{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 4px color-mix(in srgb,var(--pos) 22%,transparent)}
.hero-title{font-weight:300;font-size:clamp(34px,10vw,46px);line-height:1.04;letter-spacing:-.015em;margin:6px 0 8px}
.hero-sub{margin:0 0 18px;color:var(--muted)}
.h2{font-weight:400;font-size:26px;letter-spacing:-.01em;margin:10px 0 14px}
.h3{font-weight:500;font-size:17px;margin:0}
.cap::first-letter{text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
small{font-size:13px;color:var(--muted);display:block}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0}

/* Surfaces */
.card{background:var(--surface);border-radius:24px;box-shadow:var(--lift);padding:18px;margin:0 0 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border-radius:18px;box-shadow:var(--lift);margin:0 0 12px}
.row b{font-weight:500}
.r{text-align:right;flex:none}
.r small{text-align:right}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--ink);color:var(--ink-contrast)}
.btn.ghost{background:var(--surface);box-shadow:var(--lift)}
.btn.danger{background:var(--neg);color:#fff}
.btn.danger-ghost{color:var(--neg);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.big{min-height:54px;padding:0 30px;font-size:16px}
.btn.wide{width:100%;margin:0 0 12px}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin:18px 0 6px}
.btns.left{justify-content:flex-start;margin:12px 0 0}
.btns .btn{flex:1 1 auto}
.btns.left .btn{flex:0 0 auto}
.stack{display:flex;flex-direction:column}
.file-btn{cursor:pointer}

/* Home hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:8px 0 22px}
.goal{position:relative;width:118px;height:118px;display:grid;place-items:center}
.goal .ring{position:absolute;inset:0}
.goal-c{text-align:center;line-height:1.1}
.goal-c b{font-weight:300;font-size:30px;display:block}
.goal-c small{font-size:12px}
.ring-bg{stroke:var(--surface-2)}
.ring-fg{stroke:var(--ink);transition:stroke-dashoffset .5s ease}
.ring-fg.full{stroke:var(--pos)}
.ring-fg.zero{opacity:0}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 24px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.quick button i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--lift);color:var(--text)}
.quick button:active i{box-shadow:var(--press)}

.spark-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.spark-card .big{font-weight:300;font-size:30px;line-height:1}
.spark{width:100%;height:56px;overflow:visible}
.spark path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.spark circle{fill:var(--ink)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 22px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:16px;font-size:12px;color:var(--muted)}
.day b{font-weight:500;font-size:17px;color:var(--text)}
.day.today{background:var(--surface);box-shadow:var(--lift)}
.day i,.cd i,.legend i{width:6px;height:6px;border-radius:50%;display:block}
.dot{background:var(--ink)}
.ring{}
i.ring{box-shadow:inset 0 0 0 1.5px var(--muted)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.sec-title h2{margin:0}

/* Deltas */
.dl{font-size:13px;font-weight:500;white-space:nowrap;font-style:normal}
.dl.pos{color:var(--pos)}
.dl.neg{color:var(--neg)}
.dl.eq{color:var(--muted)}

/* Session */
.title-in{width:100%;background:transparent;border:0;font-weight:300;font-size:clamp(30px,9vw,40px);letter-spacing:-.015em;padding:4px 0;margin:2px 0 6px;border-bottom:1px solid transparent}
.title-in:focus{outline:none;border-bottom-color:var(--line)}
.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.gauge{position:relative;width:180px;height:180px;margin:10px auto 6px;display:grid;place-items:center}
.gauge .ring{position:absolute;inset:0;margin:auto}
.gauge-c{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge-c b{font-weight:300;font-size:40px;line-height:1}
.gauge-c span{font-size:13px;color:var(--muted)}
.stats3,.stats4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0 22px}
.stats4{grid-template-columns:repeat(2,1fr);gap:14px;text-align:left;margin:14px 0 18px}
.stats3 b,.stats4 b{font-weight:400;font-size:22px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--lift);font-size:14px}
.chip.on{background:var(--ink);color:var(--ink-contrast);box-shadow:none}

.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:0 0 10px}
.mini-actions{display:flex;gap:2px;color:var(--muted);flex:none}
.mini-actions button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.mini-actions button:active{box-shadow:var(--press)}
.sug{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--pos);padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pos) 45%,transparent);margin:0 0 10px}
.set-head,.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
.set-head{font-size:12px;color:var(--muted);margin:0 0 6px}
.set-head span{text-align:center}
.set{padding:5px 0;border-radius:14px}
.set .n{text-align:center;color:var(--muted);font-size:14px}
.span2{grid-column:span 2}
.num{width:100%;min-width:0;background:var(--surface-2);border:0;border-radius:12px;padding:11px 6px;text-align:center;font-size:18px;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);box-shadow:var(--press)}
.set.done .chk{background:var(--pos);color:#fff;box-shadow:none}
.set.done .num{background:color-mix(in srgb,var(--pos) 13%,var(--surface-2))}
.item-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.set-btns{display:flex;gap:6px;flex-wrap:wrap}
.iv{text-align:right;margin-left:auto}
.iv b{font-weight:500;font-size:16px;display:block}

.field{width:100%;background:var(--surface-2);border:0;border-radius:14px;padding:12px 14px;font-size:16px;resize:vertical}
.lab{display:block;font-size:14px;color:var(--muted);margin:0 0 12px}
.lab .field,.lab input[type=range]{margin-top:6px;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--ink)}
.mini{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mini input,.mini select{width:100%;background:var(--surface-2);border:0;border-radius:12px;padding:10px 8px;font-size:16px;color:var(--text);min-width:0}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.cal-head .h2{margin:0}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font-size:12px;color:var(--muted);margin:0 0 6px}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;font-size:15px}
.cd.today span{font-weight:600}
.cd.sel{background:var(--ink);color:var(--ink-contrast)}
.cd.sel .dot{background:var(--ink-contrast)}
.cd.missed span{color:var(--neg)}
.legend{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--muted);margin:12px 0 20px}
.legend span{display:flex;align-items:center;gap:6px}
.day-panel .h3{margin:0 0 12px;font-weight:400;font-size:20px}
.plan-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.plan-acts{display:flex;gap:6px;flex:none}

/* Plans */
.page-head{display:flex;justify-content:space-between;align-items:center}
.routine-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ink-contrast);flex:none}
.routine-ex{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.routine-ex li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}

/* Progress */
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;margin:0 0 8px}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--lift)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .pt{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.chart .pt.last.pos{fill:var(--pos);stroke:var(--pos)}
.chart .pt.last.neg{fill:var(--neg);stroke:var(--neg)}
.bars rect{fill:color-mix(in srgb,var(--ink) 22%,transparent)}
.bars rect.cur{fill:var(--ink)}
.bars rect.cur.pos{fill:var(--pos)}
.bars rect.cur.neg{fill:var(--neg)}
.kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.kpi b{font-weight:300;font-size:38px;line-height:1}
.select{appearance:none;-webkit-appearance:none;width:100%;background:var(--surface);box-shadow:var(--lift);border:0;border-radius:16px;padding:14px 16px;font-size:17px;margin:0 0 14px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.recs b{font-weight:400;font-size:18px;display:block}
.det{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.det b{font-weight:500}
.pr{display:inline-block;font-size:11px;font-weight:600;color:var(--pos);margin-left:6px;vertical-align:2px}
.note{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:14px 0}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 8px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
.nav button.on{color:var(--text)}
.nav .go i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ink-contrast);margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.nav .go.live i{background:var(--pos);color:#fff}

/* Rest */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--ink);color:var(--ink-contrast);border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;width:max-content;max-width:calc(100% - 24px)}
.rest[hidden]{display:none}
.rest b{font-weight:400;font-size:22px;min-width:56px}
.rest .rb{min-height:36px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--ink-contrast) 14%,transparent);font-size:14px}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--pos);width:0}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:88%}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 14px}
.sh-title{font-weight:400;font-size:22px;margin:0}
.sh-title.big{font-size:30px;font-weight:300}
.re-item{background:var(--surface);border-radius:18px;box-shadow:var(--lift);padding:14px;margin:0 0 12px}
.re-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.re-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.set-grp{margin:0 0 22px}
.set-grp .lab{margin:0 0 8px;color:var(--text);font-weight:500}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.days7 button{aspect-ratio:1;border-radius:50%;background:var(--surface);box-shadow:var(--lift);font-size:14px}
.days7 button.on{background:var(--ink);color:var(--ink-contrast);box-shadow:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--ink-contrast);padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:600px){.re-fields{grid-template-columns:repeat(5,1fr)}}

/* Coach IA */
.meta-row.three{grid-template-columns:repeat(3,1fr)}
.h3 .ic,.status .ic,summary b .ic{display:inline-block;vertical-align:-3px;margin-right:4px}
.ai-list{margin:6px 0 14px;padding-left:20px}
.ai-list li{margin:0 0 6px}
.ai-sec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.ai-load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 10px;color:var(--muted);text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-err{background:color-mix(in srgb,var(--neg) 12%,var(--surface));color:var(--text);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text);margin:0 6px 6px 0}
.tag.pos{background:color-mix(in srgb,var(--pos) 18%,var(--surface));}
.tag.neg{background:color-mix(in srgb,var(--neg) 16%,var(--surface));}
.chips.wrap-ok{flex-wrap:wrap;overflow:visible}
.ex-plan{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex-plan b{font-weight:500}
.ex-plan small{margin-top:2px}
.item-note{font-size:13px;color:var(--muted);margin:-4px 0 10px;font-style:italic}
details.brief summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.brief summary::-webkit-details-marker{display:none}
details.brief[open] summary{margin-bottom:6px}
.key-steps{margin:8px 0 12px;padding-left:20px;color:var(--muted);font-size:14px}
.key-steps a{color:var(--text)}
.ivt{border-radius:24px;padding:26px 18px;text-align:center;background:var(--surface);box-shadow:var(--lift);margin:0 0 12px;transition:background .3s}
.ivt.ph-work{background:color-mix(in srgb,var(--pos) 22%,var(--surface))}
.ivt.ph-rest{background:var(--surface-2)}
.ivt-ph{margin:0;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.ivt-t{display:block;font-weight:300;font-size:84px;line-height:1.05;margin:6px 0}
.ivt-bar{display:block;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.ivt-bar i{display:block;height:100%;width:0;background:var(--ink)}
/* Pause, cotation, santé */
.live-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pause-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#e8a317;box-shadow:0 0 0 4px rgba(232,163,23,.22)}
.paused-card{background:color-mix(in srgb,#e8a317 16%,var(--surface));border-radius:20px;padding:14px 16px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.paused-card p{margin:0;font-size:14px}
.stats3.four{grid-template-columns:repeat(4,1fr)}
.diff-row{margin:10px 0 2px;padding-top:10px;border-top:1px solid var(--line)}
.diff-row p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.diff-row .seg button{font-size:13px;min-height:34px}
.diff-row .seg button.on.d1,.diff-row .seg button.on.d2{color:var(--pos)}
.diff-row .seg button.on.d5,.diff-row .seg button.on.d4{color:var(--neg)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hgrid b{font-weight:400;font-size:22px;display:block}
.meter{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin:8px 0 4px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:4px}
.meter i.pos{background:var(--pos)}
.meter i.neg{background:var(--neg)}
.hrow{padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hrow-top b{font-weight:500}
.zones{display:grid;gap:6px;margin-top:8px}
.zones div{display:flex;justify-content:space-between;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.badge b{display:block;font-size:22px;margin-bottom:4px;color:var(--text);font-weight:400}
.badge.on{background:color-mix(in srgb,var(--pos) 16%,var(--surface));color:var(--text)}
.plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.plate{min-width:54px;padding:12px 8px;border-radius:12px;background:var(--ink);color:var(--ink-contrast);text-align:center;font-weight:500}
.sug.down{color:var(--neg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--neg) 45%,transparent)}
.disclaim{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 16px}
</style>

<body>
<header class="top"><div class="top-in"><span class="brand">CHARGE</span><span id="sync" class="sync"></span><button class="icon-btn" data-a="settings" aria-label="Réglages" id="gear"></button></div></header>
<main id="view"></main>
<div id="rest" class="rest" hidden></div>
<nav class="nav" aria-label="Navigation principale"><div class="nav-in" id="nav"></div></nav>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- Icônes ---------- */
const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 play:'<path d="M8 5.5v13l11-6.5z"/>',
 chart:'<path d="M4 4v16h16"/><path d="M8 15l4-5 3 3 5-7"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 share:'<circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 13.3l7.2 4.4M15.6 6.3l-7.2 4.4"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 up:'<path d="M6 15l6-6 6 6"/>',
 down:'<path d="M6 9l6 6 6-6"/>',
 left:'<path d="M15 6l-6 6 6 6"/>',
 right:'<path d="M9 6l6 6-6 6"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
 repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
 download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
 bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6"/>',
 pause:'<path d="M8.5 5v14M15.5 5v14"/>',
 heart:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/>',
 flame:'<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.6-5.6 3.9-8.8.4 2 1.6 3.2 2.6 3.6.3-2.4 1.5-4.7 3.3-6.1-.2 3.4 3.2 5.6 3.2 10.6 0 4-2.7 6.9-6.5 6.9z"/>',
 disc:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/>'
};
function ic(n,s){s=s||22;const fill=n==='play';return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="${fill?'none':'currentColor'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;}

/* ---------- Utilitaires ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const clamp=(v,a,b)=>Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,v));
const esc=v=>String(v===null||v===undefined?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===null||v===undefined||v===''||isNaN(+v))?null:+v;
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const pad2=n=>String(n).padStart(2,'0');
const CAP=()=>(window.Capacitor&&window.Capacitor.Plugins)||null;
const isCancel=e=>/cancel/i.test(String(e&&(e.message||e)));
function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseISO(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
const todayISO=()=>iso(new Date());
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function monthOf(ds){const d=parseISO(ds);return new Date(d.getFullYear(),d.getMonth(),1);}
const NF={};
function fmtNum(n,dec){dec=dec||0;const k='d'+dec;if(!NF[k])NF[k]=new Intl.NumberFormat('fr-CA',{maximumFractionDigits:dec});return NF[k].format(+n||0);}
function fmtSec(s){s=Math.round(+s||0);if(s<60)return s+' s';const m=Math.floor(s/60),r=s%60;return r?`${m} min ${pad2(r)}`:`${m} min`;}
function fmtDur(s){s=Math.round(+s||0);if(s<3600)return Math.round(s/60)+' min';const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return `${h} h ${pad2(m)}`;}
function fmtClock(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${pad2(m)}:${pad2(x)}`:`${pad2(m)}:${pad2(x)}`;}
function fmtDate(ds){return parseISO(ds).toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'});}
function fmtDateLong(ds){return parseISO(ds).toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));

/* ---------- Données par défaut ---------- */
const GROUPS=['Pectoraux','Dos','Jambes','Épaules','Bras','Tronc','Cardio','Autre'];
const TYPE_LABEL={w:'Charge',bw:'Poids du corps',t:'Temps',c:'Cardio'};
const DAYS_SHORT=['L','M','M','J','V','S','D'];
const DAYS_NAME=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const DEFAULT_EX=[
 ['e1','Développé couché','Pectoraux','w'],['e2','Développé incliné haltères','Pectoraux','w'],['e3','Écarté à la poulie','Pectoraux','w'],['e4','Pompes','Pectoraux','bw'],['e5','Dips','Pectoraux','bw'],
 ['e6','Tractions','Dos','bw'],['e7','Rowing barre','Dos','w'],['e8','Tirage vertical','Dos','w'],['e9','Rowing haltère','Dos','w'],['e10','Soulevé de terre','Dos','w'],
 ['e11','Squat','Jambes','w'],['e12','Presse à cuisses','Jambes','w'],['e13','Fentes marchées','Jambes','w'],['e14','Soulevé de terre roumain','Jambes','w'],['e15','Leg curl','Jambes','w'],
 ['e16','Développé militaire','Épaules','w'],['e17','Élévations latérales','Épaules','w'],['e18','Face pull','Épaules','w'],
 ['e19','Curl biceps','Bras','w'],['e20','Curl marteau','Bras','w'],['e21','Extension triceps à la poulie','Bras','w'],['e22','Barre au front','Bras','w'],
 ['e23','Hip thrust','Jambes','w'],['e24','Mollets debout','Jambes','w'],
 ['e25','Crunch','Tronc','bw'],['e26','Relevés de jambes','Tronc','bw'],['e27','Planche','Tronc','t'],['e28','Pallof press','Tronc','w'],
 ['e29','Course','Cardio','c'],['e30','Vélo','Cardio','c'],['e31','Rameur','Cardio','c'],['e32','Corde à sauter','Cardio','t']
];
function it(exId,sets,reps,weight,rest,extra){return Object.assign({exId,sets,reps,weight,time:null,dist:null,rest},extra||{});}
function defaultProfile(){return {goal:'',level:'',age:null,weight:null,height:null,sex:'',equip:[],duration:45,target:'',limits:'',prefs:'',rhr:null,waist:null};}
function defaultState(){
 return {v:1,updatedAt:0,
  settings:{unit:'kg',rest:90,weekGoal:3,theme:'auto',hourly:'on',aiBrief:'on'},
  profile:defaultProfile(),
  exercises:DEFAULT_EX.map(a=>({id:a[0],name:a[1],group:a[2],type:a[3]})),
  routines:[
   {id:'r1',name:'Haut du corps',items:[it('e1',4,8,60,120),it('e7',4,10,50,90),it('e16',3,10,30,90),it('e19',3,12,12,60)]},
   {id:'r2',name:'Bas du corps',items:[it('e11',4,6,80,150),it('e14',3,10,60,120),it('e12',3,12,120,90),it('e27',3,null,null,60,{time:45})]},
   {id:'r3',name:'Full body express',items:[it('e10',3,5,90,150),it('e4',3,15,null,60),it('e6',3,8,null,90),it('e29',1,null,null,0,{dist:3,time:18})]}
  ],
  schedule:[],sessions:[],bodylog:[],active:null};
}
function migrate(d){
 const base=defaultState();
 d.settings=Object.assign(base.settings,d.settings||{});
 d.profile=Object.assign(defaultProfile(),d.profile||{});if(!Array.isArray(d.profile.equip))d.profile.equip=[];
 ['exercises','routines','schedule','sessions','bodylog'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=base[k];});
 if(d.active===undefined)d.active=null;
 return d;
}

/* ---------- Stockage local + synchro ---------- */
const LS_KEY='charge.v1';
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&d.v===1)return migrate(d);}}catch(e){}return defaultState();}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
let S=loadLocal();
function save(){S.updatedAt=Date.now();writeLocal();queueCloud();}

const cloud={ref:null,busy:false,pending:false,timer:null,status:'local'};
async function initCloud(){
 try{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  const db=res[0],user=res[1];
  if(!db||!user)return;
  const id=await user.id();
  if(!id)return;
  const ref=db.doc('data/users/'+id+'/state');
  const snap=await ref.get();
  cloud.ref=ref;cloud.status='ok';
  if(snap.exists){
   const d=snap.data()||{};
   if(d.json&&(d.updatedAt||0)>(S.updatedAt||0)){
    const r=JSON.parse(d.json);
    if(r&&r.v===1){S=migrate(r);writeLocal();applyTheme();render();}
   }else if((S.updatedAt||0)>(d.updatedAt||0))queueCloud(10);
  }else if(S.updatedAt)queueCloud(10);
 }catch(e){cloud.ref=null;cloud.status='local';}
 updateSync();
}
function queueCloud(ms){if(!cloud.ref)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(pushCloud,ms===undefined?1200:ms);}
async function pushCloud(){
 if(!cloud.ref)return;
 if(cloud.busy){cloud.pending=true;return;}
 cloud.busy=true;
 try{await cloud.ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt});cloud.status='ok';}catch(e){cloud.status='err';}
 cloud.busy=false;updateSync();
 if(cloud.pending){cloud.pending=false;pushCloud();}
}
function updateSync(){
 const el=$('#sync');if(!el)return;
 el.className='sync'+(cloud.status==='ok'?' ok':cloud.status==='err'?' err':'');
 el.textContent=cloud.status==='ok'?'Synchronisé':cloud.status==='err'?'Synchro en attente':'Sur cet appareil';
 const l=$('#sync-long');if(l)l.textContent=syncLong();
}
function syncLong(){
 return cloud.status==='ok'?'Tes données sont enregistrées sur cet appareil et synchronisées avec ton compte Claude.':cloud.status==='err'?'La synchronisation a échoué. Tes données restent enregistrées sur cet appareil.':'Tes données sont enregistrées sur cet appareil. Exporte une sauvegarde de temps en temps.';
}
let DL=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')DL=await window.claude.use('downloads');}catch(e){}})();
async function saveFile(name,text,mime){
 const P=CAP();
 if(P&&P.Share){try{await P.Share.share({title:name,text,dialogTitle:'Enregistrer ou envoyer '+name});return;}catch(e){if(isCancel(e))return;}}
 if(DL){
  try{await DL.save({filename:name,data:new Blob([text],{type:mime})});toast('Fichier enregistré');return;}
  catch(e){if(e&&e.code==='declined')return;}
 }
 try{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Téléchargement lancé');
 }catch(e){copyText(text);}
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);toast('Copié dans le presse-papiers');}
 catch(e){openSheet('copy',`<div class="sh-head"><h3 class="sh-title">Copier le texte</h3><button class="icon-btn" data-a="close" aria-label="Fermer">${ic('x')}</button></div><p class="muted small">Sélectionne le texte puis copie-le.</p><textarea class="field" rows="10" readonly>${esc(t)}</textarea>`);}
}
async function shareText(title,text){
 const P=CAP();
 if(P&&P.Share){try{await P.Share.share({title,text,dialogTitle:title});return;}catch(e){if(isCancel(e))return;}}
 if(navigator.share){try{await navigator.share({title,text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
 copyText(text);
}

/* ---------- Accès aux données ---------- */
const U=()=>S.settings.unit;
const inc=()=>U()==='lb'?5:2.5;
function exById(id){return S.exercises.find(x=>x.id===id)||{id,name:'Exercice supprimé',group:'Autre',type:'w'};}
function routineById(id){return S.routines.find(x=>x.id===id);}
function sortedSessions(){return S.sessions.slice().sort((a,b)=>a.date===b.date?(a.start||0)-(b.start||0):(a.date<b.date?-1:1));}
function sessionsOn(d){return S.sessions.filter(s=>s.date===d);}
function lastEntry(exId,excludeId,beforeDate){
 const ss=sortedSessions();
 for(let i=ss.length-1;i>=0;i--){const s=ss[i];if(s.id===excludeId)continue;if(beforeDate&&s.date>beforeDate)continue;
  const e=s.items.find(x=>x.exId===exId&&x.sets.some(y=>y.done));if(e)return {s,e};}
 return null;
}
function lastSessionOfRoutine(rid,excludeId,beforeDate){
 const ss=sortedSessions();
 for(let i=ss.length-1;i>=0;i--){const s=ss[i];if(s.id===excludeId)continue;if(beforeDate&&s.date>beforeDate)continue;if(s.routineId===rid)return s;}
 return null;
}
function entryStats(e){
 const ex=exById(e.exId);let vol=0,reps=0,time=0,dist=0,sets=0,top=0,e1=0;
 for(const s of e.sets){if(!s.done)continue;sets++;const r=+s.reps||0,w=+s.weight||0;
  if(ex.type==='w'||ex.type==='bw'){reps+=r;vol+=r*w;top=Math.max(top,w);if(r>0&&w>0&&r<=15)e1=Math.max(e1,w*(1+r/30));}
  else if(ex.type==='t'){time+=+s.time||0;}
  else{time+=(+s.time||0)*60;dist+=+s.dist||0;}}
 return {vol,reps,time,dist,sets,top,e1};
}
function sessionStats(s){
 let vol=0,sets=0,reps=0,total=0;
 for(const e of s.items){const st=entryStats(e);vol+=st.vol;sets+=st.sets;reps+=st.reps;total+=e.sets.length;}
 const dur=s.duration!=null?s.duration:(s.start?Math.max(0,Math.round(((s.end||Date.now())-s.start-pausedMs(s))/1000)):0);
 return {vol,sets,reps,total,dur};
}
function primary(ex,st){
 if(ex.type==='t')return {v:st.time,txt:fmtSec(st.time),lab:'temps total'};
 if(ex.type==='c')return st.dist>0?{v:st.dist,txt:fmtNum(st.dist,2)+' km',lab:'distance'}:{v:st.time,txt:fmtSec(st.time),lab:'durée'};
 if(st.vol>0)return {v:st.vol,txt:fmtNum(st.vol)+' '+U(),lab:'charge totale'};
 return {v:st.reps,txt:fmtNum(st.reps)+' reps',lab:'répétitions'};
}
function deltaHTML(cur,prev){
 if(!prev||!cur)return '';
 const d=(cur-prev)/prev*100;
 if(Math.abs(d)<0.5)return '<em class="dl eq">= identique</em>';
 return `<em class="dl ${d>0?'pos':'neg'}">${d>0?'▲ +':'▼ '}${fmtNum(d,1)} %</em>`;
}
function setsSummary(ex,e){
 const done=e.sets.filter(s=>s.done);if(!done.length)return 'aucune série';
 if(ex.type==='t')return done.map(s=>fmtSec(s.time)).join(', ');
 if(ex.type==='c')return done.map(s=>[s.dist?fmtNum(+s.dist,2)+' km':'',s.time?fmtNum(+s.time)+' min':''].filter(Boolean).join(' ')).join(', ');
 const part=s=>(+s.weight?`${fmtNum(+s.reps||0)} × ${fmtNum(+s.weight,2)}`:`${fmtNum(+s.reps||0)} reps`);
 const parts=done.map(part);
 const same=parts.every(p=>p===parts[0]);
 const unit=done.some(s=>+s.weight)?' '+U():'';
 if(same&&done.length>1){const s=done[0];return +s.weight?`${done.length} × ${fmtNum(+s.reps||0)} @ ${fmtNum(+s.weight,2)} ${U()}`:`${done.length} × ${fmtNum(+s.reps||0)} reps`;}
 return parts.join(', ')+unit;
}
const DIFF_LAB=['Très facile','Facile','Juste bien','Difficile','Trop dur'];
const feel=e=>e&&e.diff?` (ressenti : ${DIFF_LAB[e.diff-1].toLowerCase()})`:'';
function isPR(e,s){
 const st=entryStats(e);if(!st.e1)return false;let best=0;
 for(const o of S.sessions){if(o.id===s.id||o.date>s.date)continue;for(const x of o.items)if(x.exId===e.exId)best=Math.max(best,entryStats(x).e1);}
 return best>0&&st.e1>best+0.01;
}
function targetTxt(x){
 const ex=exById(x.exId);
 if(ex.type==='t')return `${x.sets||1} × ${fmtSec(x.time||0)}`;

/* ---------- Planification ---------- */
function occurs(p,d){
 if(p.skip&&p.skip.includes(d))return false;
 if(d<p.date)return false;
 if(p.until&&d>p.until)return false;
 const rp=p.repeat||'none';
 if(rp==='none')return d===p.date;
 const diff=Math.round((parseISO(d)-parseISO(p.date))/864e5);
 if(rp==='days')return diff%(Math.max(1,+p.every||1))===0;
 if(rp==='weekly'){
  const wd=(parseISO(d).getDay()+6)%7;if(!(p.days||[]).includes(wd))return false;
  const wdiff=Math.round((mondayOf(parseISO(d))-mondayOf(parseISO(p.date)))/(7*864e5));
  return wdiff%(Math.max(1,+p.every||1))===0;
 }
 return false;
}
function plannedOn(d){return S.schedule.filter(p=>occurs(p,d));}
function doneFor(p,d){return sessionsOn(d).some(s=>s.routineId===p.routineId);}
function repeatLabel(p){
 let t;const n=Math.max(1,+p.every||1);
 if(p.repeat==='weekly'){const days=(p.days||[]).slice().sort().map(i=>DAYS_NAME[i]).join(', ');t=(n>1?`Toutes les ${n} semaines`:'Chaque semaine')+` : ${days}`;}
 else if(p.repeat==='days')t=n>1?`Tous les ${n} jours`:'Tous les jours';
 else t='Une seule fois';
 if(p.repeat!=='none'&&p.until)t+=`, jusqu'au ${fmtDate(p.until)}`;
 return t;
}

function ring(p,size,stroke,id){
 const r=(size-stroke)/2,c=2*Math.PI*r,pp=clamp(p),off=c*(1-pp),h=size/2;
 return `<svg ${id?`id="${id}"`:''} class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${stroke}" class="ring-bg"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${stroke}" class="ring-fg${pp>=1?' full':''}${pp<=0?' zero':''}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" data-c="${c}" transform="rotate(-90 ${h} ${h})"/></svg>`;
}
function smoothPath(P){
 if(!P.length)return '';if(P.length===1)return `M${P[0][0]},${P[0][1]}`;
 let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
 for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
  const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
  d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
 return d;
}
function spark(vals){
 const w=200,h=56,max=Math.max(1,...vals),step=w/(vals.length-1);
 const P=vals.map((v,i)=>[i*step,h-6-(v/max)*(h-14)]);const L=P[P.length-1];
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${smoothPath(P)}" vector-effect="non-scaling-stroke"/><circle cx="${L[0]}" cy="${L[1]}" r="3.5"/></svg>`;
}
function lineChart(pts,fmtV){
 if(!pts.length)return '<p class="empty">Pas encore de données pour cet exercice.</p>';
 const W=320,H=170,pl=6,pr=6,pt=20,pb=24;const vs=pts.map(p=>p.v);
 let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1;}const padv=(mx-mn)*0.15;mn-=padv;mx+=padv;
 const X=i=>pts.length===1?W/2:pl+i*(W-pl-pr)/(pts.length-1);const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
 const P=pts.map((p,i)=>[X(i),Y(p.v)]);const last=pts[pts.length-1].v,first=pts[0].v;
 const cls=pts.length>1?(last>first?'pos':last<first?'neg':''):'';
 const bi=vs.indexOf(Math.max(...vs));
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique de progression">
 <line class="grid" x1="0" x2="${W}" y1="${pt}" y2="${pt}"/><line class="grid" x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}"/>
 <path class="ln" d="${smoothPath(P)}"/>
 ${P.map((p,i)=>`<circle class="pt${i===P.length-1?' last '+cls:''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===P.length-1?5:3.2}"/>`).join('')}
 <text x="${clamp(P[bi][0],20,W-40)}" y="${P[bi][1]-9}" text-anchor="middle">${esc(fmtV(vs[bi]))}</text>
 <text x="0" y="${H-6}">${esc(fmtDate(pts[0].d))}</text>${pts.length>1?`<text x="${W}" y="${H-6}" text-anchor="end">${esc(fmtDate(pts[pts.length-1].d))}</text>`:''}
 </svg>`;
}
function weekBars(){

  return {a,v:S.sessions.filter(s=>s.date>=A&&s.date<=B).reduce((t,s)=>t+sessionStats(s).vol,0)};});

function vTrain(){
 if(!S.sessions.length)return `<p class="empty">Termine une première séance pour voir ta progression ici.</p>`;
 const hist=S.exercises.filter(x=>S.sessions.some(s=>s.items.some(e=>e.exId===x.id&&e.sets.some(y=>y.done))));
 if(!UI.progEx||!hist.find(x=>x.id===UI.progEx))UI.progEx=hist[0]&&hist[0].id;
 const ex=exById(UI.progEx);
 const M={w:[['e1','1RM estimé'],['top','Charge max'],['vol','Volume']],bw:[['reps','Reps'],['vol','Volume'],['top','Lest max']],t:[['time','Temps']],c:[['dist','Distance'],['time','Durée']]}[ex.type];
 if(!M.find(m=>m[0]===UI.progMetric))UI.progMetric=M[0][0];
 const mk=UI.progMetric;
 const fmtV=v=>mk==='time'?(ex.type==='c'?fmtNum(v,0)+' min':fmtSec(v)):mk==='dist'?fmtNum(v,2)+' km':mk==='reps'?fmtNum(v)+' reps':fmtNum(v,mk==='vol'?0:1)+' '+U();
 const pts=[];let bestE1=null,bestTop=null,bestVol=null;
 for(const s of sortedSessions()){const e=s.items.find(x=>x.exId===ex.id&&x.sets.some(y=>y.done));if(!e)continue;const st=entryStats(e);
  let v=mk==='time'&&ex.type==='c'?st.time/60:st[mk];if(v>0)pts.push({d:s.date,v});
  if(st.e1&&(!bestE1||st.e1>bestE1.v))bestE1={v:st.e1,d:s.date};if(st.top&&(!bestTop||st.top>bestTop.v))bestTop={v:st.top,d:s.date};if(st.vol&&(!bestVol||st.vol>bestVol.v))bestVol={v:st.vol,d:s.date};}
 const last=pts.length?pts[pts.length-1].v:0,first=pts.length?pts[0].v:0;
 const t=new Date(),M1=iso(new Date(t.getFullYear(),t.getMonth(),1));
 const monthN=S.sessions.filter(s=>s.date>=M1).length;
 let streak=0;{let w=mondayOf(t);const has=w0=>{const A=iso(w0),B=iso(addDays(w0,6));return S.sessions.some(s=>s.date>=A&&s.date<=B);};if(!has(w))w=addDays(w,-7);while(has(w)){streak++;w=addDays(w,-7);}}
 const D30=iso(addDays(t,-29));const vol30=S.sessions.filter(s=>s.date>=D30).reduce((a,s)=>a+sessionStats(s).vol,0);
 const rec=(lab,o,f)=>`<div><small>${lab}</small><b>${o?f(o.v):'—'}</b><small>${o?fmtDate(o.d):''}</small></div>`;
 const kcal30=S.sessions.filter(s=>s.date>=D30).reduce((a,s)=>a+sessKcal(s).kcal,0);
 return `
 <div class="card"><div class="recs"><div><small>Ce mois-ci</small><b>${monthN}</b><small>séances</small></div><div><small>Régularité</small><b>${streak}</b><small>semaine${streak>1?'s':''} de suite</small></div><div><small>30 derniers jours</small><b>${fmtNum(vol30)}</b><small>${U()} soulevés</small></div></div><div class="recs" style="margin-top:12px"><div><small>Calories (30 j)</small><b>${fmtNum(kcal30)}</b><small>kcal estimées</small></div><div><small>Temps actif (30 j)</small><b>${fmtDur(S.sessions.filter(s=>s.date>=D30).reduce((a,s)=>a+sessionStats(s).dur,0))}</b><small>d'entraînement</small></div><div><small>Records</small><b>${countPR()}</b><small>battus au total</small></div></div></div>
 <div class="card"><h3 class="h3">Charge totale par semaine</h3><small style="margin-bottom:12px">Cette semaine comparée à la précédente</small>${weekBars()}</div>
 <select class="select" data-ch="progEx" aria-label="Choisir un exercice">${hist.map(x=>`<option value="${x.id}"${x.id===ex.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <div class="card"><div class="seg">${M.map(m=>`<button class="${m[0]===mk?'on':''}" data-a="progMetric" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
 <div class="kpi"><b>${pts.length?esc(fmtV(last)):'—'}</b>${pts.length>1?deltaHTML(last,first)+'<small>depuis le début</small>':''}</div>${lineChart(pts,fmtV)}</div>
 ${ex.type==='w'||ex.type==='bw'?`<div class="card"><h3 class="h3" style="margin-bottom:12px">Records</h3><div class="recs">${rec('1RM estimé',bestE1,v=>fmtNum(v,1)+' '+U())}${rec('Charge max',bestTop,v=>fmtNum(v,2)+' '+U())}${rec('Meilleur volume',bestVol,v=>fmtNum(v)+' '+U())}</div><small style="margin-top:12px">1RM estimé selon la formule d'Epley, sur les séries de 15 reps ou moins.</small></div>`:''}
 ${balanceCard()}${badgesCard()}`;
}

function importRoutineCode(txt){
 const flat=String(txt).replace(/\s+/g,'');const m=flat.match(/CHARGE1:([A-Za-z0-9+/=]+)\./)||flat.match(/CHARGE1:([A-Za-z0-9+/=]+)/);if(!m)return null;
 try{
  const d=JSON.parse(b64d(m[1]));if(!d||!Array.isArray(d.i))return null;
  const r={id:uid(),name:String(d.n||'Plan importé').slice(0,60),items:[]};
  for(const x of d.i){
   let ex=S.exercises.find(e=>norm(e.name)===norm(x.e));
   if(!ex){ex={id:uid(),name:String(x.e||'Exercice').slice(0,60),group:GROUPS.includes(x.g)?x.g:'Autre',type:['w','bw','t','c'].includes(x.t)?x.t:'w',custom:true};S.exercises.push(ex);}
   r.items.push({exId:ex.id,sets:num(x.s)||1,reps:num(x.r),weight:num(x.w),time:num(x.ti),dist:num(x.d),rest:num(x.re)===null?S.settings.rest:num(x.re)});
  }
  S.routines.push(r);save();return r;
 }catch(e){return null;}
}

 const p=id?S.schedule.find(x=>x.id===id):null;const d0=date||todayISO();
 SD=p?clone(p):{id:uid(),routineId:rid||S.routines[0].id,date:d0,repeat:'weekly',days:[(parseISO(d0).getDay()+6)%7],every:1,until:'',skip:[]};

/* ---------- Minuterie de repos, chrono, écran ---------- */
const REST={end:0,total:0,iv:null};
function startRest(sec){
 if(!sec)return;REST.total=sec;REST.end=Date.now()+sec*1000;
 const el=$('#rest');el.innerHTML=`<span class="small">Repos</span><b id="rest-t">${fmtClock(sec)}</b><button class="rb" data-a="restAdd">+15 s</button><button class="rb" data-a="restSkip">Passer</button><i class="rest-bar" id="rest-p"></i>`;
 el.hidden=false;if(!REST.iv)REST.iv=setInterval(tickRest,250);tickRest();
}
function stopRest(){REST.end=0;clearInterval(REST.iv);REST.iv=null;$('#rest').hidden=true;}
function tickRest(){
 const left=Math.ceil((REST.end-Date.now())/1000);
 if(left<=0){stopRest();try{navigator.vibrate&&navigator.vibrate([220,120,220]);}catch(e){}beep();toast('Repos terminé, série suivante');return;}
 const t=$('#rest-t');if(t)t.textContent=fmtClock(left);
 const p=$('#rest-p');if(p)p.style.width=(100*(1-left/REST.total)).toFixed(1)+'%';
}
function beep(f,ms){try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f||880;g.gain.value=0.08;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},ms||260);}catch(e){}}
function pausedMs(a){return (+a.pausedMs||0)+(a.pausedAt?Date.now()-a.pausedAt:0);}
function activeSec(a){return Math.max(0,Math.floor((Date.now()-a.start-pausedMs(a))/1000));}
function tickClock(){if(!S.active)return;const sec=activeSec(S.active);if(sec%15===0){const k=$('#sv-kcal');if(k&&ED&&ED.mode==='live')k.textContent=fmtNum(sessKcal(S.active).kcal);}const t=fmtClock(sec);document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=t;});hourCheck(sec);}
setInterval(tickClock,1000);
let WAKE=null;
async function requestWake(){try{if(S.active&&!S.active.pausedAt&&navigator.wakeLock&&!WAKE){WAKE=await navigator.wakeLock.request('screen');WAKE.addEventListener('release',()=>{WAKE=null;});}}catch(e){}}
function releaseWake(){try{if(WAKE)WAKE.release();}catch(e){}WAKE=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestWake();tickClock();}});

/* ---------- Calories, ajustements, santé ---------- */
const toKg=w=>U()==='lb'?w*0.45359:w;
const fromKg=k=>U()==='lb'?k/0.45359:k;
function bodyKg(){const w=num(S.profile.weight);return w?toKg(w):null;}
function cardioMET(ex,kmh){
 const n=norm(ex.name);
 if(/course|run|jog|sprint|tapis/.test(n)){if(kmh&&kmh>2){const v=kmh*1000/60;return clamp(kmh<7.5?(0.1*v+3.5)/3.5:(0.2*v+3.5)/3.5,2.5,23);}return 9.8;}
 if(/marche|walk|rando/.test(n)){if(kmh)return clamp((0.1*kmh*1000/60+3.5)/3.5,2,7);return 3.8;}
 if(/velo|bike|cycl|spin/.test(n)){if(kmh)return kmh<16?6:kmh<20?8:kmh<25?10:12;return 7.5;}
 if(/rameur|row|aviron/.test(n))return 7;
 if(/corde|jump/.test(n))return 11;
 if(/nage|natation|swim/.test(n))return 7;
 if(/ellipt/.test(n))return 5;
 if(/escalier|stair/.test(n))return 9;
 return 7;
}
// Dépense estimée par la méthode MET : kcal/min = MET × 3,5 × kg / 200
function sessKcal(s){
 const kg=bodyKg()||75,st=sessionStats(s),per=(met,min)=>met*3.5*kg/200*min;
 let k=0,cMin=0,bw=0,wt=0;
 for(const e of s.items){const ex=exById(e.exId);
  for(const x of e.sets){if(!x.done)continue;
   if(ex.type==='c'){const t=+x.time||0,d=+x.dist||0,m=t||d*6;if(!m)continue;k+=per(cardioMET(ex,t&&d?d/(t/60):null),m);cMin+=m;}
   else if(ex.type==='t'&&ex.group==='Cardio'){const m=(+x.time||0)/60;k+=per(cardioMET(ex),m);cMin+=m;}
   else if(ex.type==='bw')bw++;else wt++;}}
 let met;
 if(s.timer||/hiit|tabata|circuit|emom|amrap|crossfit|metcon/.test(norm(s.name)))met=8;
 else if(s.rpe)met=clamp(3+s.rpe*0.45,3.5,8);
 else met=bw>wt*1.5?5.5:5;
 k+=per(met,Math.max(0,st.dur/60-cMin));
 return {kcal:Math.round(k),est:!bodyKg()};
}
function sugFor(e,ex,prev,i){
 if(!prev)return '';const ps=prev.e.sets.filter(x=>x.done);if(!ps.length)return '';const d=prev.e.diff||0;
 const btn=(f,v,txt,up)=>e.sets.some(x=>!x.done)?`<button class="sug${up?'':' down'}" data-a="applySugF" data-i="${i}" data-f="${f}" data-v="${v}">${ic(up?'up':'down',16)} ${txt}</button>`:'';
 if(ex.type==='w'){const w=Math.max(...ps.map(x=>+x.weight||0));if(!w)return '';let nw=null,why='';
  if(d===1){nw=w+2*inc();why='Très facile la dernière fois';}
  else if(d===2){nw=w+inc();why='Facile la dernière fois';}
  else if(d===5){nw=Math.max(0,w-inc());why='Trop dur la dernière fois';}
  else if(d!==4&&e.target&&e.target.reps&&ps.every(x=>(+x.reps||0)>=e.target.reps)){nw=w+inc();why='Toutes les reps réussies';}
  if(nw===null)return '';nw=Math.round(nw*100)/100;
  if(nw>w&&e.sets.some(x=>(+x.weight||0)>=nw))return '';
  if(nw<w&&e.sets.every(x=>x.done||(+x.weight||0)<=nw))return '';
  return btn('weight',nw,`${why} : ${nw>w?'monter':'descendre'} à ${fmtNum(nw,2)} ${U()}`,nw>w);}
 if(ex.type==='bw'&&[1,2,5].includes(d)){const r=Math.max(...ps.map(x=>+x.reps||0));if(!r)return '';const nr=d===5?Math.max(1,r-2):r+(d===1?3:2);
  if(e.sets.every(x=>x.done||(+x.reps||0)===nr))return '';
  return btn('reps',nr,`${DIFF_LAB[d-1]} la dernière fois : viser ${nr} reps`,nr>r);}
 if(ex.type==='t'&&[1,2,5].includes(d)){const t=Math.max(...ps.map(x=>+x.time||0));if(!t)return '';const nt=d===5?Math.max(5,t-10):t+(d===1?20:10);
  if(e.sets.every(x=>x.done||(+x.time||0)===nt))return '';
  return btn('time',nt,`${DIFF_LAB[d-1]} la dernière fois : viser ${fmtSec(nt)}`,nt>t);}
 return '';
}
function logBody(w){const d=todayISO();S.bodylog=S.bodylog.filter(x=>x.d!==d);S.bodylog.push({d,w:+w});S.bodylog.sort((a,b)=>a.d<b.d?-1:1);}
const SEXK=()=>S.profile.sex==='Homme'?'m':S.profile.sex==='Femme'?'f':null;
function bmi(){const kg=bodyKg(),h=num(S.profile.height);return kg&&h?kg/((h/100)**2):null;}
const bmiCat=b=>b<18.5?['Insuffisance pondérale','neg']:b<25?['Poids santé','pos']:b<30?['Surpoids','']:['Obésité','neg'];
// Deurenberg (1991) : estimation à partir de l'IMC, de l'âge et du sexe
function bodyFat(){const b=bmi(),a=num(S.profile.age),sx=SEXK();if(!b||!a||!sx)return null;return clamp(1.2*b+0.23*a-10.8*(sx==='m'?1:0)-5.4,3,60);}
function bfCat(bf){const r=SEXK()==='m'?[6,14,18,25]:[14,21,25,32];return bf<r[0]?['Très bas','neg']:bf<r[1]?['Athlétique','pos']:bf<r[2]?['Forme','pos']:bf<r[3]?['Moyenne','']:['Élevé','neg'];}
// Mifflin-St Jeor
function bmr(){const kg=bodyKg(),h=num(S.profile.height),a=num(S.profile.age);if(!kg||!h||!a)return null;const sx=SEXK();return 10*kg+6.25*h-5*a+(sx==='m'?5:sx==='f'?-161:-78);}
const since=days=>{const D=iso(addDays(new Date(),-(days-1)));return S.sessions.filter(s=>s.date>=D);};
function actFactor(){const n=since(28).length/4;return n<1?1.2:n<3?1.375:n<5?1.55:n<7?1.725:1.9;}
function hrMax(){const a=num(S.profile.age);return a?Math.round(208-0.7*a):null;}   // Tanaka
const VO2N={m:[[29,42],[39,40],[49,38],[59,35],[69,32],[200,29]],f:[[29,36],[39,34],[49,32],[59,29],[69,27],[200,25]]};
function vo2Avg(){const a=num(S.profile.age),sx=SEXK();if(!a||!sx)return null;return VO2N[sx].find(r=>a<=r[0])[1];}
// VDOT de Daniels à partir de la meilleure course récente (≥ 1,5 km)
function vo2Run(){
 const D=iso(addDays(new Date(),-120));let best=null;
 for(const s of S.sessions){if(s.date<D)continue;for(const e of s.items){const ex=exById(e.exId);if(ex.type!=='c'||!/course|run|jog|tapis/.test(norm(ex.name)))continue;
  for(const x of e.sets){if(!x.done)continue;const d=+x.dist,t=+x.time;if(!(d>=1.5)||!(t>=5)||t>300)continue;const v=d*1000/t;
   const vd=(-4.6+0.182258*v+0.000104*v*v)/(0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t));
   if(vd>20&&vd<90&&(!best||vd>best.v))best={v:vd,d:s.date,dist:d,t};}}}
 return best;
}
function vo2Rhr(){const m=hrMax(),r=num(S.profile.rhr);return m&&r&&r>30&&r<120?15.3*m/r:null;}   // Uth
const rhrCat=r=>r<55?['Excellent (sportif)','pos']:r<62?['Très bon','pos']:r<70?['Bon','pos']:r<80?['Dans la moyenne','']:['Élevé','neg'];
const LIFTS=[['developpe couche','Développé couché',{m:[.5,.75,1,1.25,1.6],f:[.3,.5,.7,.9,1.1]}],['squat','Squat',{m:[.75,1,1.5,2,2.5],f:[.5,.75,1.1,1.5,1.9]}],['souleve de terre','Soulevé de terre',{m:[1,1.25,1.75,2.25,2.75],f:[.6,.9,1.3,1.75,2.2]}],['developpe militaire','Développé militaire',{m:[.35,.5,.7,.9,1.1],f:[.2,.35,.5,.65,.8]}]];
const LVL=['Débutant','Novice','Intermédiaire','Avancé','Élite'];
function liftRows(){
 const kg=bodyKg(),sx=SEXK()||'m';if(!kg)return [];const D=iso(addDays(new Date(),-180));
 return LIFTS.map(L=>{const ex=S.exercises.find(x=>norm(x.name)===L[0]);if(!ex)return null;let best=0;
  for(const s of S.sessions){if(s.date<D)continue;for(const e of s.items)if(e.exId===ex.id)best=Math.max(best,entryStats(e).e1);}
  if(!best)return null;const ratio=toKg(best)/kg,st=L[2][sx];let lv=-1;st.forEach((v,k)=>{if(ratio>=v)lv=k;});
  return {name:L[1],best,ratio,lv,next:st[lv+1],max:st[4]};}).filter(Boolean);
}
function streakWeeks(){let n=0,w=mondayOf(new Date());const has=w0=>{const A=iso(w0),B=iso(addDays(w0,6));return S.sessions.some(s=>s.date>=A&&s.date<=B);};if(!has(w))w=addDays(w,-7);while(has(w)){n++;w=addDays(w,-7);}return n;}
function countPR(){let n=0;for(const s of S.sessions)for(const e of s.items)if(isPR(e,s))n++;return n;}
function healthLine(){
 const a=[],b=bmi();if(b)a.push(`IMC ${fmtNum(b,1)} (${bmiCat(b)[0].toLowerCase()})`);
 const bf=bodyFat();if(bf)a.push(`masse grasse estimée ${fmtNum(bf,0)} %`);
 if(S.profile.rhr)a.push(`FC au repos ${S.profile.rhr} bpm`);
 const v=(vo2Run()||{}).v||vo2Rhr();if(v)a.push(`VO2max estimé ${fmtNum(v,0)} (moyenne âge/sexe ${vo2Avg()||'?'})`);
 const bl=S.bodylog.filter(x=>x.d>=iso(addDays(new Date(),-30)));if(bl.length>1)a.push(`poids ${fmtNum(bl[0].w,1)} → ${fmtNum(bl[bl.length-1].w,1)} ${U()} sur 30 jours`);
 const lr=liftRows();if(lr.length)a.push('force relative : '+lr.map(r=>`${r.name} ${fmtNum(r.ratio,2)}× poids de corps (${r.lv>=0?LVL[r.lv]:'débutant'})`).join(', '));
 return a.join(' ; ');
}
const tag=(c)=>`<span class="tag ${c[1]}">${esc(c[0])}</span>`;
const meter=(p,cls)=>`<div class="meter"><i class="${cls||''}" style="width:${(clamp(p)*100).toFixed(1)}%"></i></div>`;
function vHealth(){
 const P=S.profile,u=U(),h=num(P.height),miss=[['age','âge'],['sex','sexe'],['weight','poids'],['height','taille']].filter(k=>!P[k[0]]).map(k=>k[1]);
 let out=miss.length?`<div class="card"><h3 class="h3">${ic('user',18)} Complète ton profil</h3><p class="muted small">Il manque : ${miss.join(', ')}. Ces données servent à calculer tes repères santé et à te comparer à la moyenne de ton âge et de ton sexe. La FC au repos et le tour de taille ajoutent d'autres indicateurs.</p><div class="btns left"><button class="btn primary sm" data-a="profEdit">Compléter mon profil</button></div></div>`:'';
 const b=bmi(),bf=bodyFat(),wh=P.waist&&h?P.waist/h:null;
 if(b||bf||wh){out+=`<div class="card"><h3 class="h3" style="margin-bottom:12px">Composition corporelle</h3><div class="hgrid">
  ${b?`<div><small>IMC</small><b>${fmtNum(b,1)}</b>${tag(bmiCat(b))}</div>`:''}
  ${bf?`<div><small>Masse grasse estimée</small><b>${fmtNum(bf,0)} %</b>${tag(bfCat(bf))}</div>`:''}
  ${h?`<div><small>Poids santé pour ${h} cm</small><b>${fmtNum(fromKg(18.5*(h/100)**2),0)} à ${fmtNum(fromKg(24.9*(h/100)**2),0)}</b><small>${u}</small></div>`:''}
  ${wh?`<div><small>Tour de taille / taille</small><b>${fmtNum(wh,2)}</b>${tag(wh<0.5?['Risque faible','pos']:wh<0.6?['Risque accru','']:['Risque élevé','neg'])}</div>`:''}
  </div><small style="margin-top:12px">Masse grasse : formule de Deurenberg (IMC, âge, sexe), moins précise chez les personnes très musclées.</small></div>`;}
 const B=bmr();
 if(B){const tdee=B*actFactor(),sport=since(28).reduce((a,s)=>a+sessKcal(s).kcal,0)/4;
  out+=`<div class="card"><h3 class="h3" style="margin-bottom:12px">${ic('flame',18)} Énergie</h3><div class="hgrid">
  <div><small>Métabolisme de base</small><b>${fmtNum(B)} kcal</b><small>par jour, au repos</small></div>
  <div><small>Besoin quotidien estimé</small><b>${fmtNum(tdee)} kcal</b><small>selon ton activité des 4 dernières semaines</small></div>
  <div><small>Dépense sportive</small><b>${fmtNum(sport)} kcal</b><small>par semaine en moyenne</small></div>
  <div><small>Pour ton objectif</small><b>${P.goal==='Perte de gras'?fmtNum(tdee-400):P.goal==='Prise de muscle'?fmtNum(tdee+250):fmtNum(tdee)} kcal</b><small>${P.goal==='Perte de gras'?'déficit modéré':P.goal==='Prise de muscle'?'léger surplus':'maintien'}</small></div></div>
  <small style="margin-top:12px">Formule de Mifflin-St Jeor. Les calories des séances sont estimées avec les valeurs MET.</small></div>`;}
 const M=hrMax(),r=num(P.rhr),run=vo2Run(),vr=vo2Rhr(),avg=vo2Avg(),v=run?run.v:vr;
 if(M){const z=[[.5,.6,'Z1 Récupération'],[.6,.7,'Z2 Endurance'],[.7,.8,'Z3 Tempo'],[.8,.9,'Z4 Seuil'],[.9,1,'Z5 VO2max']];
  const hr=p=>Math.round(r?r+p*(M-r):p*M);
  let vo='';if(v){const pos=avg?(v>avg*1.1?['Au-dessus de la moyenne','pos']:v<avg*0.9?['Sous la moyenne','neg']:['Dans la moyenne','']):null;
   vo=`<div class="hrow"><div class="hrow-top"><b>VO2max estimé</b><b>${fmtNum(v,0)} ml/kg/min</b></div>${avg?meter(v/(avg*1.6),pos[1])+`<small>Moyenne pour ton âge et ton sexe : environ ${avg}. ${pos[0]}.</small>`:''}<small>${run?`Calculé sur ta course de ${fmtNum(run.dist,2)} km en ${fmtNum(run.t,1)} min (${fmtDate(run.d)}).`:'Estimé avec ta FC au repos (formule de Uth).'}</small></div>`;}
  out+=`<div class="card"><h3 class="h3" style="margin-bottom:6px">${ic('heart',18)} Cœur et cardio</h3>
  <div class="hrow"><div class="hrow-top"><b>FC maximale théorique</b><b>${M} bpm</b></div><small>Formule de Tanaka (208 − 0,7 × âge)</small></div>
  ${r?`<div class="hrow"><div class="hrow-top"><b>FC au repos</b><b>${r} bpm</b></div>${tag(rhrCat(r))}<small>Adulte moyen : 60 à 80 bpm. Plus elle est basse, meilleure est souvent la forme cardio.</small></div>`:''}
  ${vo}

const NOTIF_BASE=7100,NOTIF_MAX=8;

async function notifPerm(){

 if(L){try{let p=await L.checkPermissions();if(p.display!=='granted')p=await L.requestPermissions();return p.display==='granted';}catch(e){return false;}}

 try{await L.createChannel({id:'training',name:'Séance en cours',description:"Rappels pendant l'entraînement",importance:4,vibration:true});}catch(e){}

  list.push({id:NOTIF_BASE+h,title:hourTitle(h),body:hourBody(h),channelId:'training',schedule:{at:new Date(at),allowWhileIdle:true}});}
 if(list.length){try{await L.schedule({notifications:list});}catch(e){}}
}

}

async function gemini(prompt,opts){

 if(!key)throw new Error('Ajoute ta clé Gemini dans Coach IA.');

  clearTimeout(to);
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===404){last=new Error('Modèle Gemini indisponible.');continue;}
  if(!r.ok){const msg=(j.error&&j.error.message)||'';
   if((r.status===400&&/api key/i.test(msg))||r.status===401||r.status===403)throw new Error('Clé Gemini refusée. Vérifie-la dans Coach IA.');
   if(r.status===429)throw new Error('Quota Gemini atteint pour le moment. Réessaie dans une minute.');
   if(r.status>=500){last=new Error('Gemini est surchargé. Réessaie dans un instant.');continue;}
   throw new Error('Erreur Gemini : '+(msg||r.status));}
  const c=j.candidates&&j.candidates[0];
  const txt=c&&c.content&&Array.isArray(c.content.parts)?c.content.parts.filter(p=>!p.thought).map(p=>p.text||'').join(''):'';
  if(!txt){last=new Error(j.promptFeedback&&j.promptFeedback.blockReason?'Demande refusée par Gemini.':'Réponse vide du coach. Réessaie.');continue;}
  try{const s=txt.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const a=s.indexOf('{'),b=s.lastIndexOf('}');return JSON.parse(a>=0&&b>a?s.slice(a,b+1):s);}
  catch(e){last=new Error('Réponse illisible du coach. Réessaie.');continue;}
 }
 throw last||new Error('Coach indisponible.');
}

 return head+`<div class="ivt" id="ivt-box"><p class="ivt-ph" id="ivt-ph">Prêt</p><b class="ivt-t" id="ivt-t">0</b><p class="muted" id="ivt-r"></p><i class="ivt-bar"><i id="ivt-p"></i></i></div>
 <div class="btns"><button class="btn ghost" data-a="ivtEnd">Arrêter</button><button class="btn primary" data-a="ivtPause" id="ivt-pb">Pause</button></div>`;
}
function ivtStart(){
 ivtStop();const seq=[];if(IVT.prep)seq.push({ph:'prep',d:IVT.prep,r:0});
 for(let r=1;r<=Math.max(1,IVT.rounds);r++){seq.push({ph:'work',d:Math.max(1,IVT.work),r});if(IVT.rest&&r<IVT.rounds)seq.push({ph:'rest',d:IVT.rest,r});}
 IVT.run={seq,k:0,end:Date.now()+seq[0].d*1000,paused:0,last:-1,iv:null};
 setSheet('ivt',ivtHTML());IVT.run.iv=setInterval(ivtTick,200);ivtTick();beep(660,200);
}
function ivtStop(){if(IVT.run&&IVT.run.iv)clearInterval(IVT.run.iv);IVT.run=null;}
function ivtTick(){
 const R=IVT.run;if(!R)return;const box=$('#ivt-box');if(!box){ivtStop();return;}
 if(R.paused)return;
 let left=(R.end-Date.now())/1000;
 if(left<=0){R.k++;
  if(R.k>=R.seq.length){clearInterval(R.iv);R.iv=null;box.className='ivt';$('#ivt-ph').textContent='Terminé, bravo';$('#ivt-t').textContent='0';$('#ivt-r').textContent=`${IVT.rounds} tours`;$('#ivt-p').style.width='100%';
   const pb=$('#ivt-pb');if(pb){pb.textContent='Recommencer';pb.dataset.a='ivtGo';}beep(990,600);try{navigator.vibrate&&navigator.vibrate([400,150,400]);}catch(e){}return;}
  R.end+=R.seq[R.k].d*1000;left=(R.end-Date.now())/1000;
  const w=R.seq[R.k].ph==='work';beep(w?990:520,w?380:300);try{navigator.vibrate&&navigator.vibrate(w?[250,80,250]:300);}catch(e){}}
 const P=R.seq[R.k],sec=Math.ceil(left);
 if(sec<=3&&sec>0&&sec!==R.last){R.last=sec;beep(740,90);}
 box.className='ivt ph-'+P.ph;
 $('#ivt-ph').textContent=P.ph==='work'?'Effort':P.ph==='rest'?'Repos':'Prépare-toi';
 $('#ivt-t').textContent=sec>=60?fmtClock(sec):String(sec);
 $('#ivt-r').textContent=P.r?`Tour ${P.r} sur ${IVT.rounds}`:`${IVT.rounds} tours de ${IVT.work} s`;
 $('#ivt-p').style.width=(100*(1-left/P.d)).toFixed(1)+'%';
}

/* ---------- Actions ---------- */
function persistED(){if(ED&&ED.mode==='live')save();}
function newSession(name){return {id:uid(),name:name||'Séance libre',routineId:null,date:todayISO(),start:Date.now(),end:null,duration:null,note:'',rpe:0,items:[]};}
function startLive(s,after){
 const doIt=()=>{closeAllSheets();stopRest();S.active=s;ED={mode:'live',s:S.active};save();go('session');requestWake();scheduleHourly();if(after)after();};
 if(S.active)confirmBox('Une séance est déjà en cours','La remplacer ? Les séries de la séance en cours seront perdues.','Remplacer',doIt,true);else doIt();
}
function addExCb(id){ED.s.items.push(makeItem(id,null,ED.mode!=='live'));persistED();closeSheet('picker');render();
 const el=$('#item-'+(ED.s.items.length-1));if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
function sessFrom(id){return S.sessions.find(x=>x.id===id);}

Object.assign(ACT,AI_ACT,HX_ACT);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=ACT[t.dataset.a];if(f){e.preventDefault();f(t.dataset,t);}});
function onField(t){
 if(t.dataset.set){const p=t.dataset.set.split(',');const x=ED&&ED.s.items[+p[0]]&&ED.s.items[+p[0]].sets[+p[1]];if(!x)return;x[p[2]]=t.value;persistED();refreshStats();return true;}
 if(t.dataset.sf){if(!ED)return;const f=t.dataset.sf;
  if(f==='durMin')ED.s.duration=Math.max(0,Math.round((+t.value||0)*60));
  else if(f==='rpe'){ED.s.rpe=+t.value;const r=$('#rpe-v');if(r)r.textContent=+t.value?t.value+'/10':'non noté';}
  else if(f==='date'){if(t.value)ED.s.date=t.value;}
  else ED.s[f]=t.value;
  persistED();return true;}
 if(t.dataset.rf){const p=t.dataset.rf.split(',');if(RD&&RD.items[+p[0]])RD.items[+p[0]][p[1]]=num(t.value);return true;}
 if(t.hasAttribute('data-rname')){if(RD)RD.name=t.value;return true;}
 if(t.dataset.sd){if(SD){const k=t.dataset.sd;SD[k]=k==='every'?Math.max(1,+t.value||1):t.value;}return true;}
 if(t.dataset.pf){const k=t.dataset.pf;S.profile[k]=['age','weight','height','rhr','waist'].includes(k)?num(t.value):t.value.slice(0,400);if(k==='weight'&&S.profile.weight)logBody(S.profile.weight);save();return true;}
 if(t.dataset.gn){if(GN)GN[t.dataset.gn]=t.value.slice(0,400);return true;}
 if(t.dataset.iv){IVT[t.dataset.iv]=Math.max(0,Math.min(3600,Math.round(+t.value||0)));const el=$('#ivt-tot');if(el)el.textContent=ivtTotal();return true;}
 if(t.id==='ai-q'){UI.aiQ=t.value;return true;}
 if(t.id==='pl-w'){PL.w=num(t.value)||0;const r=$('#pl-res');if(r)r.innerHTML=platesRes();return true;}
 if(t.id==='pk-q'){PK.q=t.value;const l=$('#pk-list');if(l)l.innerHTML=pickerList();return true;}
}
document.addEventListener('input',e=>onField(e.target));
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.ch==='progEx'){UI.progEx=t.value;render();return;}
 if(t.id==='imp-file'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importBackup(String(r.result));r.readAsText(f);return;}
 if(t.dataset.sd)onField(t);
});
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}}

/* ---------- Démarrage ---------- */
(function(){const P=CAP();if(P&&P.App){try{P.App.addListener('backButton',()=>{if(document.querySelector('.sheet-wrap')){closeSheet();return;}if(UI.view!=='home'){go('home');return;}if(P.App.minimizeApp)P.App.minimizeApp();else P.App.exitApp();});}catch(e){}}})();
buildChrome();applyTheme();
if(S.active){ED={mode:'live',s:S.active};UI.view='session';requestWake();scheduleHourly();}
render();
initCloud();
if('serviceWorker' in navigator&&!window.Capacitor){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
